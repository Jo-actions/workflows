name: nodejs-feature-branch-workflow
on: 
  workflow_call:
    inputs:
      project: 
        description: 'Project name'
        required: true
        type: string 
      component:
       description: 'component name'
       required: false
       type: string
      environment:
        description: 'Env name'
        required: true
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
     - name: checkout code
       uses : actions/checkout@v6

     - name: list the files
       run: ls -l
